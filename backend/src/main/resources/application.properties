spring.application.name=vivlio-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vivlio}
spring.datasource.username=${DB_USERNAME:vivlio}
spring.datasource.password=${DB_PASSWORD:vivlio}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema e versionado pelo Flyway (db/migration). O Hibernate so confere se bate (DT-01).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Sem valor padrao de proposito (DT-03): a aplicacao nao sobe sem JWT_SECRET definido.
vivlio.jwt.secret=${JWT_SECRET:}
vivlio.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:7200000}

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
